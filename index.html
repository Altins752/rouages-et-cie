<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rouages & Cie</title>
<meta name="description" content="Jeu incrémental industriel : de la forge du grand-père au groupe mondial.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Saira+Stencil+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3l11 6.5v13L16 29 5 22.5v-13z' fill='%23f2b705' stroke='%23141414' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23141414'/%3E%3C/svg%3E">
</head>
<body>
<div class="app" id="app">
  <header class="console" id="console">
    <div class="plate brand-plate">
      <div class="brand">Rouages &amp; Cie</div>
      <div class="site" id="siteName">Forge du quartier</div>
    </div>
    <div class="lcd" id="lcd" aria-live="off">
      <div class="lcd-main"><span id="money">0</span><small>€</small><span class="lcd-rate" id="rate"></span></div>
      <div class="lcd-sub" id="obj"><span id="objL">Dette</span><b id="objR">—</b></div>
      <div class="lcd-sub"><span>Stock <b id="stock">0</b></span><span id="infoR"></span></div>
    </div>
    <div class="gauge" id="gauge" title="Compte-tours : maintenir le clic sur l'usine (ou la barre d'espace) accélère le temps">
      <svg viewBox="0 0 150 86" aria-label="Compte-tours, vitesse du temps" role="img">
        <path d="M14 78 A61 61 0 0 1 136 78" fill="none" stroke="#2b2f35" stroke-width="12"/>
        <path id="gRed" fill="none" stroke="#7a1d16" stroke-width="12"/>
        <path id="gArc" fill="none" stroke="#f2b705" stroke-width="12"/>
        <g id="ticks"></g>
        <line id="needle" x1="75" y1="78" x2="75" y2="26" stroke="#ffb02e" stroke-width="3" stroke-linecap="round"/>
        <circle cx="75" cy="78" r="6" fill="#ffb02e"/>
        <text id="gTxt" x="75" y="70" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="14" fill="#ffb02e">×1,0</text>
      </svg>
      <div class="lbl">Vitesse du temps</div>
    </div>
    <div class="lamps" id="lamps">
      <div class="lamp" data-lamp="panne"><i></i>Panne</div>
      <div class="lamp" data-lamp="reseau"><i></i>Réseau</div>
      <div class="lamp" data-lamp="ferrum"><i></i>Ferrum</div>
      <div class="lamp" data-lamp="contrat"><i></i>Contrat</div>
    </div>
    <div class="sys">
      <button type="button" class="sysbtn" id="btnSound" aria-pressed="true"><span class="led"></span>Son</button>
      <button type="button" class="sysbtn" id="btnFx" aria-pressed="true"><span class="led"></span>Effets</button>
      <button type="button" class="sysbtn" id="btnRadio" aria-pressed="true"><span class="led"></span>Radio</button>
      <button type="button" class="sysbtn" id="btnTheme">Thème : auto</button>
      <button type="button" class="sysbtn" id="btnHelp">Aide <kbd>H</kbd></button>
      <button type="button" class="sysbtn" id="btnPhoto">Carte postale <kbd>P</kbd></button>
      <button type="button" class="sysbtn" id="btnMenu">Menu</button>
    </div>
  </header>
  <main class="floor">
    <section class="stage" id="stage" aria-label="L'usine. Maintenir le clic ou la barre d'espace pour accélérer le temps.">
      <canvas id="glcv" aria-hidden="true"></canvas>
      <canvas id="cv" aria-hidden="true"></canvas>
      <canvas id="uicv" aria-hidden="true"></canvas>
      <div class="telex" id="telex" role="dialog" aria-live="polite" aria-labelledby="tFrom">
        <div class="from" id="tFrom"></div>
        <div class="txt" id="tTxt"></div>
        <div class="telex-foot"><span class="count" id="tCount"></span><button type="button" id="tOk">Compris <kbd>Entrée</kbd></button></div>
      </div>
      <div class="toasts" id="toasts" aria-live="polite"></div>
      <div class="tip" id="tip" role="tooltip"></div>
      <div class="stage-hint" id="hint"></div>
    </section>
    <aside class="panel" id="panel">
      <div class="hazard"></div>
      <nav class="tabs" id="tabs" role="tablist">
        <button type="button" role="tab" data-t="atelier">Atelier<kbd>1</kbd><span class="dot"></span></button>
        <button type="button" role="tab" data-t="equipe">Équipe<kbd>2</kbd><span class="dot"></span></button>
        <button type="button" role="tab" data-t="rd">R&amp;D<kbd>3</kbd><span class="dot"></span></button>
        <button type="button" role="tab" data-t="marche">Marché<kbd>4</kbd><span class="dot"></span></button>
        <button type="button" role="tab" data-t="donnees">Données<kbd>5</kbd><span class="dot"></span></button>
      </nav>
      <div class="list" id="list" role="tabpanel"></div>
    </aside>
  </main>
</div>
<div class="overlay" id="overlay" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
